services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:7701:7700"
    volumes:
      - meilidata:/meili_data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:51638:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python scripts/init_db.py;
              uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:51637:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://inkweave.demo.vesper36.cc
      NEXT_PUBLIC_SITE_URL: https://inkweave.demo.vesper36.cc
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
      - frontend_next:/app/.next

volumes:
  pgdata:
  meilidata:
  frontend_nm:
  frontend_next:
